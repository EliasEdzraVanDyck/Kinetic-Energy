<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>Loading…</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <!-- The FULLSCREEN GATE: the game is only playable fullscreen (the fullscreen
           shader passes render wrong at embed size), so outside fullscreen this overlay
           blocks all input and offers the one way in. -->
      <div id="fullscreen-gate" style="position:absolute;inset:0;display:none;z-index:10;
           background:rgba(0,0,0,0.82);color:#fff;font-family:system-ui,sans-serif;
           display:flex;align-items:center;justify-content:center;flex-direction:column;
           cursor:pointer;text-align:center;">
        <div style="font-size:28px;margin-bottom:10px;">Click to play fullscreen</div>
        <div style="font-size:14px;opacity:0.7;">This game runs in fullscreen only.</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fullscreenGate = document.querySelector("#fullscreen-gate");
      var gameInstance = null;
      fullscreenGate.style.display = "none"; // hidden until the game has loaded

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Escape is the BROWSER's key now: it exits fullscreen, and the gate catches the
      // player on the way out. The game's pause key on the web is backquote (` / ~, set
      // by a WebGL-only binding override in PauseController), so the old Keyboard Lock
      // dance over Escape is gone with nothing to replace it.

      document.addEventListener("fullscreenchange", function () {
        if (document.fullscreenElement) {
          fullscreenGate.style.display = "none";
          // Fullscreen swaps the focused element in some browsers; without this the
          // canvas stops receiving keys and the game looks frozen.
          canvas.focus();
        } else {
          // Out of fullscreen = out of play: the gate returns, input stops reaching
          // the game (blur), and the only path forward is back through the gate.
          fullscreenGate.style.display = "flex";
          canvas.blur();
        }
      });

      fullscreenGate.addEventListener("click", function () {
        if (gameInstance) gameInstance.SetFullscreen(1);
      });

      // Keys only reach Unity while the canvas holds focus. In an itch iframe the page
      // does not start focused, so the first click has to hand it over - and clicking
      // anywhere in the frame should count, not only the canvas itself.
      document.addEventListener("pointerdown", function () { canvas.focus(); });

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          gameInstance = unityInstance;
          // Loaded but not yet fullscreen: the gate is the front door.
          fullscreenGate.style.display = "flex";
        }).catch((message) => {
          // Shown ON the page, not in an alert: a failed load used to leave nothing but
          // the page background, which says nothing about what went wrong.
          showFatal(message);
        });
      };

      script.onerror = () => {
        showFatal("Could not load " + loaderUrl + " - check that the Build folder sits next to index.html.");
      };

      function showFatal(message) {
        document.querySelector("#unity-loading-bar").style.display = "none";
        var box = document.createElement("div");
        box.style = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);"
          + "max-width:80%;padding:16px;background:#300;color:#fdd;border:1px solid #f66;"
          + "font-family:system-ui,sans-serif;font-size:14px;white-space:pre-wrap;text-align:left";
        box.textContent = "The game could not start.\n\n" + message;
        document.querySelector("#unity-container").appendChild(box);
      }

      document.body.appendChild(script);
    </script>
  </body>
</html>
